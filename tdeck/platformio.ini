; PlatformIO project for LilyGO T-Deck Plus (ESP32-S3, 16MB flash, 8MB OPI PSRAM)
; Firmware: Notes app (SD card) + Audio recorder (ES7210 mic -> WAV on SD)

[env:T-Deck]
platform = espressif32@6.9.0
board = T-Deck
board_build.flash_mode = qio
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM=1
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
lib_deps =
    moononournation/GFX Library for Arduino@1.3.7
    mikalhart/TinyGPSPlus@1.0.3
